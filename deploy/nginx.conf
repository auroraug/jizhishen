events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  client_max_body_size 100m;
  upstream frontend { server frontend:3000; }
  upstream backend { server backend:8000; }
  server {
    listen 80;
    server_name _;
    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  }
}
